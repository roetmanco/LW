		<wrapper class="b last fw-header" id="box2">
			
            <column class="content">
				
				<dragger id="drag2"></dragger>
                
                <spacer></spacer>
                
                    <spawn class="header"></spawn>
				
                    <block class="info subject show" id="terms">
						<p>Terms blabalalsl</p>
					</block>

                    <block class="info subject hide" id="shipping">
						<p>shipping whaat</p>
					</block>
				
                    <block class="info subject hide" id="contact">
						
                        <form  action="https://formsubmit.co/lukewualf@roetman.co" method="POST" class="contact">
									<input type="hidden" name="_subject" value="LW Contact">
									<input type="hidden" name="_next" value="https://www.lukewualf.nl">
									<input type="hidden" name="_captcha" value="false">
									<input type="text" name="_honey" style="display:none">
									<label for="name" class="first">
										<input type="text" name="name" id="name" class="form-control" placeholder="*  What's your name?" required>
									</label>
									<label for="email">
										<input type="email" name="email" id="email" class="form-control" placeholder="*  ... and your e-mail?" required>
									</label>
									<label for="message">
										<textarea placeholder="Okay, so why are you reaching out?" id="message" name="message" rows="4"></textarea>
									</label>
									<button type="submit" class="submit">Subscribe</button>
                        </form>
						
						<p>If you don't get a response within 5 workdays, please try again or reach out through <a href="https://www.instagram.com" target="_blank">instagram</a>.</p>
						
					</block>
                
                <spacer class="bottom"></spacer>

            </column>
